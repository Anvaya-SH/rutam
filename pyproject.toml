[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rutam"
version = "0.1.0"
description = "RUTAM's persistent graph-memory foundation, developed by Anvaya.sh"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Anvaya.sh" }]
keywords = [
    "graph-neural-network",
    "memory-augmented-llm",
    "persistent-memory",
    "lfm3",
    "pytorch",
    "cpu-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4.5",
    "numpy>=1.26",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
rutam-prepare = "rutam.installer:main_prepare"
rutam-verify = "rutam.installer:main_verify"
rutam-attach-lfm3 = "rutam.installer:main_attach_lfm3"

[tool.hatch.build.targets.wheel]
packages = ["src/rutam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Keep local installs CPU-only, including `uv sync --extra dev`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
